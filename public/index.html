<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WebXR Plane Mapper</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- three.js はバージョン固定でCDNから読み込む（更新時は両方の行を揃えて変更） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- WebGL canvas は main.js がここに追加する -->
  <div id="canvas-root"></div>

  <!-- dom-overlay の root。AR中もこの要素だけはカメラ映像の上に表示される -->
  <div id="ui-overlay" data-state="IDLE">

    <!-- ① IDLE -->
    <section class="panel" data-panel="IDLE">
      <h1>WebXR Plane Mapper</h1>
      <p class="lead">床や壁にカメラを向けて、ゆっくり動かしてください。<br />認識された平面が半透明で表示されます。</p>
      <p id="compat-status" class="compat">対応状況を確認中…</p>
      <button id="btn-start" class="btn primary" disabled>ARスキャン開始</button>
    </section>

    <!-- ② AR_SCANNING -->
    <section class="panel" data-panel="AR_SCANNING">
      <header class="hud top">
        <div id="hud-plane-count">検出平面: 0面</div>
        <div class="legend">
          <span class="badge horizontal">水平</span>
          <span class="badge vertical">垂直</span>
          <span class="badge unknown">未分類</span>
        </div>
        <div id="hud-warning" class="warning" hidden></div>
      </header>
      <footer class="hud bottom">
        <button id="btn-toggle-feed" class="btn" aria-pressed="false">映像 OFF</button>
        <button id="btn-finish" class="btn primary">スキャン完了・全体確認へ</button>
      </footer>
    </section>

    <!-- ③ PREVIEW_EXPORT -->
    <section class="panel" data-panel="PREVIEW_EXPORT">
      <header class="hud top">
        <div id="hud-preview-stats">平面 0面 / 0.00 ㎡ / 0 頂点</div>
        <button id="btn-wireframe" class="btn small" aria-pressed="false">ワイヤーフレーム</button>
      </header>
      <footer class="hud bottom">
        <button id="btn-export-glb" class="btn primary">GLB形式で保存</button>
        <button id="btn-export-obj" class="btn" title="OBJは色情報を含みません">OBJ形式で保存</button>
        <button id="btn-reset" class="btn danger">新規スキャン</button>
      </footer>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
